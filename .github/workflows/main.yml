name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { exit 1 }

      - name: Download Rclone Direct Portable Binary and Setup MEGA
        run: |
          # Create a dedicated permanent folder for Rclone binary
          New-Item -ItemType Directory -Force -Path "C:\RcloneStudio"
          
          # Download official Rclone windows standalone zip
          Invoke-WebRequest -Uri "https://rclone.org" -OutFile "C:\RcloneStudio\rclone.zip"
          
          # Extract the zip file
          Expand-Archive -Path "C:\RcloneStudio\rclone.zip" -DestinationPath "C:\RcloneStudio\Extracted" -Force
          
          # Locate and move the main rclone.exe directly to C:\RcloneStudio\rclone.exe
          $exePath = Get-ChildItem -Path "C:\RcloneStudio\Extracted" -Filter "rclone.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exePath.FullName -Destination "C:\RcloneStudio\rclone.exe" -Force
          
          # Configure MEGA remote using our brand new direct binary path
          & "C:\RcloneStudio\rclone.exe" config create mega_backup mega user "${{ secrets.MEGA_USERNAME }}" pass "${{ secrets.MEGA_PASSWORD }}"

      - name: Maintain Connection & Start Auto-Backup Timer
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # BACKGROUND JOB: 5.30 ghante baad chalne wala auto-backup
          Start-Job -Name "MegaBackupJob" -ScriptBlock {
              Start-Sleep -Seconds 19800
              
              if (-not (Test-Path "$env:TEMP\backup_done.txt")) {
                  New-Item -Path "$env:TEMP\backup_done.txt" -ItemType File -Force
                  
                  # Permanent absolute manual path execution
                  & "C:\RcloneStudio\rclone.exe" copy "$env:USERPROFILE\AppData" "mega_backup:AppData" --update --use-server-modtime
              }
          }

          # Keep RDP active
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }

      # EMERGENCY STEP: Manual cancel button dabaane par ya timeout hone par yeh backup trigger karega
      - name: Final Emergency Backup on Cancellation or Timeout
        if: always()
        run: |
          Write-Host "Checking backup status..."
          
          if (-not (Test-Path "$env:TEMP\backup_done.txt")) {
              Write-Host "Triggering final incremental backup to MEGA before shutdown..."
              New-Item -Path "$env:TEMP\backup_done.txt" -ItemType File -Force
              
              $localPath = "$env:USERPROFILE\AppData"
              $remotePath = "mega_backup:AppData"
              
              # Direct permanent binary execution without any environment issues
              & "C:\RcloneStudio\rclone.exe" copy "$localPath" "$remotePath" --update --use-server-modtime --verbose
              
              Write-Host "Emergency Backup finished successfully!"
          } else {
              Write-Host "Backup was already completed by the background timer. Skipping duplicate upload."
          }
