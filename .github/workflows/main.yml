name: macOS-Automatic-Chrome-Desktop

on:
  workflow_dispatch:

jobs:
  remotedesktop:
    runs-on: macos-15-intel
    timeout-minutes: 3600

    steps:
      - name: Install Google Chrome Remote Desktop via Brew
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Configure and Start Automatically
        run: |
          # Pure system mein jahan bhi host file hai use dhoondh kar direct execute karein
          HOST_PATH=$(find /Applications /Library -name "remoting_start_host" -type f -print -quit 2>/dev/null)
          
          if [ -z "$HOST_PATH" ]; then
            echo "Error: remoting_start_host nahi mila!"
            exit 1
          fi
          
          echo "Found host binary at: $HOST_PATH"
          
          sudo "$HOST_PATH" \
            --code="${{ secrets.CHROME_AUTH_CODE }}" \
            --redirect-url="https://google.com" \
            --name="GitHub-Mac-Screen" \
            --pin="123456"

      - name: Maintain Active Session
        run: |
          echo "=== CHROME REMOTE DESKTOP ACTIVE ==="
          echo "Bhai, ab seedhe Chrome Remote Desktop website ya App par check karo!"
          echo "===================================="
          while true; do
              echo "[$(date)] Mac Screen is Sharing..."
              sleep 300
          done
