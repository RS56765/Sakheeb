name: macOS-Remote-Access

on:
  workflow_dispatch:

jobs:
  secure-mac-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Create VNC User and Enable Screen Sharing
        run: |
          sudo dscl . -create /Users/RDP
          sudo dscl . -create /Users/RDP UserShell /bin/bash
          sudo dscl . -create /Users/RDP RealName "RDP User"
          sudo dscl . -create /Users/RDP UniqueID 501
          sudo dscl . -create /Users/RDP PrimaryGroupID 20
          sudo dscl . -create /Users/RDP NFSHomeDirectory /Users/RDP
          
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)
          sudo dscl . -passwd /Users/RDP "$PASSWORD"
          sudo createhomedir -c -u RDP
          
          sudo dscl . -append /Groups/admin GroupMembership RDP
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -privs -all -allowAccessFor -allUsers
          
          echo "VNC_CREDS=User: RDP | Password: $PASSWORD" >> $GITHUB_ENV
          
      - name: Install Tailscale via Homebrew
        run: |
          brew install tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          retries=0
          while [ -z "$TS_IP" ] && [ $retries -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              retries=$((retries+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP nahi mila!"
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Connection & Show Details
        run: |
          echo -e "\n=== macOS SCREEN SHARING ACCESS ==="
          echo "VNC Address: vnc://$TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: $VNC_CREDS"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS VNC Active - Use Ctrl+C or cancel workflow to stop"
              sleep 300
          done
