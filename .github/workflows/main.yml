name: macOS-Automatic-Chrome-Desktop

on:
  workflow_dispatch:

jobs:
  remotedesktop:
    runs-on: macos-15-intel
    timeout-minutes: 3600

    steps:
      - name: Install Google Chrome Remote Desktop via Brew
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Configure and Start Automatically
        run: |
          # Yahan system khud Google ki command ko run karega aapke token ke saath
          sudo /Library/PrivilegedHelperTools/chrome-remote-desktop-host.app/Contents/MacOS/remoting_start_host \
            --code="${{ secrets.CHROME_AUTH_CODE }}" \
            --redirect-url="https://google.com" \
            --name="GitHub-Mac-Screen" \
            --pin="123456" # Aapka login PIN fixed '123456' set kar diya hai

      - name: Maintain Active Session
        run: |
          echo "=== CHROME REMOTE DESKTOP ACTIVE ==="
          echo "Bhai, ab seedhe Chrome Remote Desktop website ya App par check karo!"
          echo "===================================="
          while true; do
              echo "[$(date)] Mac Screen is Sharing..."
              sleep 300
          done
