name: RDP with Full User Backup & Custom Password

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Number Password
        run: |
          $password = "${{ secrets.RDP_CUSTOM_PASS }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDPUser"
          }
          
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install MEGAcmd & Restore User Profile
        run: |
          Write-Host "Installing MEGAcmd..."
          winget install Mega.MEGAcmd --silent --accept-source-agreements --accept-package-agreements
          $env:Path += ";$env:LOCALAPPDATA\MEGAcmd"
          
          Write-Host "Logging into MEGA..."
          mega-login ${{ secrets.MEGA_EMAIL }} ${{ secrets.MEGA_PASSWORD }}
          
          Write-Host "Restoring your data from MEGA..."
          if (mega-ls /RDP_Full_Backup) {
              mega-get /RDP_Full_Backup "C:\Users\RDPUser"
              Write-Host "Data restored successfully to user profile!"
          } else {
              Write-Host "No prior backup found. Starting fresh."
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Connection Details & Maintain
        run: |
          Write-Host "`n========================================"
          Write-Host "          RDP CONNECTION READY          "
          Write-Host "========================================"
          Write-Host " Address  : $env:TAILSCALE_IP"
          Write-Host " Username : RDPUser"
          Write-Host " Password : $env:RDP_PASS"
          Write-Host "========================================"
          Write-Host "Keep this window open..."
          
          while ($true) {
              Start-Sleep -Seconds 300
          }

      - name: Backup User Profile to MEGA on Exit
        if: always()
        run: |
          $env:Path += ";$env:LOCALAPPDATA\MEGAcmd"
          try {
              mega-login ${{ secrets.MEGA_EMAIL }} ${{ secrets.MEGA_PASSWORD }}
              Write-Host "Backing up entire user profile to MEGA..."
              mega-put -c "C:\Users\RDPUser" /RDP_Full_Backup
              Write-Host "Full Profile Backup completed successfully!"
          } catch {
              Write-Host "Backup failed or skipped."
          }
