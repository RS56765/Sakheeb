name: macOS-Remote-Access

on:
  workflow_dispatch:

jobs:
  secure-mac-vnc:
    runs-on: macos-15-intel  
    timeout-minutes: 3600

    steps:
      - name: Create VNC User and Force Screen Initialization
        run: |
          # 1. User Account Setup
          sudo dscl . -create /Users/macuser
          sudo dscl . -create /Users/macuser UserShell /bin/bash
          sudo dscl . -create /Users/macuser RealName "Mac Remote User"
          sudo dscl . -create /Users/macuser UniqueID 503
          sudo dscl . -create /Users/macuser PrimaryGroupID 20
          sudo dscl . -create /Users/macuser NFSHomeDirectory /Users/macuser
          
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)
          sudo dscl . -passwd /Users/macuser "$PASSWORD"
          sudo createhomedir -c -u macuser
          sudo dscl . -append /Groups/admin GroupMembership macuser
          
          # 2. HEADLESS FIX: macOS Login window ko command line se wake-up aur refresh karein
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysMultiUser -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAcceptLegacyConnections -bool true
          
          # Force resolution and load graphical server window
          sudo /bin/launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          
          # 3. Enable Remote Access Service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -privs -all -allowAccessFor -allUsers
            
          echo "VNC_CREDS=User: macuser | Password: $PASSWORD" >> $GITHUB_ENV
          
      - name: Install Tailscale via Homebrew
        run: |
          brew install tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          retries=0
          while [ -z "$TS_IP" ] && [ $retries -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              retries=$((retries+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP nahi mila!"
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Connection & Show Details
        run: |
          echo -e "\n=== macOS SCREEN SHARING ACCESS ==="
          echo "VNC Address: vnc://$TAILSCALE_IP"
          echo "Username: macuser"
          echo "Password: $VNC_CREDS"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS VNC Active - Use Ctrl+C or cancel workflow to stop"
              sleep 300
          done
