name: RDP-with-MEGA-AppData-Backup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          Write-Host "Choco ke jariye Tailscale install ho raha hai..."
          choco install tailscale -y --no-progress
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          Update-SessionEnvironment

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) { $tsExe = "tailscale" }
          
          Write-Host "Starting Tailscale via: $tsExe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP nahi mila. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 connectivity failed"
              exit 1
          }
          Write-Host "Connectivity successful!"

      - name: Maintain Connection (Timer Step)
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # 5 hours 40 minutes = 20400 seconds
          $totalWaitSeconds = 20400
          $checkIntervalSeconds = 300
          $elapsedSeconds = 0
          
          Write-Host "[$(Get-Date)] RDP active hai. Backup 5 hours 40 mins ke baad ya cancel karne par chalega."

          while ($elapsedSeconds -lt $totalWaitSeconds) {
              Start-Sleep -Seconds $checkIntervalSeconds
              $elapsedSeconds += $checkIntervalSeconds
              $timeLeft = $totalWaitSeconds - $elapsedSeconds
              Write-Host "[$(Get-Date)] Runner Active. Backup window in $($timeLeft / 60) minutes."
          }

      - name: Execute MEGA AppData Backup via Embedded Engine
        if: always()
        shell: powershell
        run: |
          Write-Host "[$(Get-Date)] Pre-built Embedded Cloud Backup Engine shuru ho raha hai..."
          
          # AppData Compress karne ke liye local Windows Tar native utility use kar rahe hain takqi library crash na ho
          Write-Host "Step 1: AppData folder ko compress kiya ja raha hai..."
          $zipPath = "$env:TEMP\Appdata_Backup.zip"
          tar -f $zipPath -c -z -C "C:\Users\RDP" AppData

          # JavaScript logic file creation jisme module verification locally generate hogi
          $jsCode = @"
          const { Storage } = require('megajs');
          const fs = require('fs');
          const path = require('path');

          const email = "${{ secrets.MEGA_EMAIL }}";
          const password = "${{ secrets.MEGA_PASSWORD }}";
          const zipPath = path.join(process.env.TEMP, 'Appdata_Backup.zip');

          console.log("Step 2: Connecting securely to MEGA Cloud API Engine...");
          const storage = new Storage({ email, password, keepalive: false });
          
          storage.login((err) => {
              if (err) {
                  console.error("MEGA Login Failed: ", err);
                  process.exit(1);
              }
              console.log("Login Successful! Validating remote folder structure...");
              
              let targetFolder = storage.root.children.find(c => c.name === 'Appdata' && c.directory);
              
              if (!targetFolder) {
                  console.log("Folder nahi mila. Creating 'Appdata' folder in cloud...");
                  storage.mkdir('Appdata', (mkdirErr, newFolder) => {
                      if (mkdirErr) { console.error(mkdirErr); process.exit(1); }
                      performUpload(newFolder);
                  });
              } else {
                  performUpload(targetFolder);
              }
          });

          function performUpload(folderNode) {
              console.log("Step 3: Checking for duplicate backup package file...");
              const stats = fs.statSync(zipPath);
              
              const duplicateFile = folderNode.children.find(c => c.name === 'Appdata_Backup.zip' && c.size === stats.size);
              if (duplicateFile) {
                  console.log("File same size ke sath pehle se cloud par maujood hai. Skipping upload.");
                  cleanup();
                  return;
              }

              console.log("Uploading unique new AppData backup package to '/Appdata'...");
              const fileStream = fs.createReadStream(zipPath);
              const uploadProcess = folderNode.upload({ name: 'Appdata_Backup.zip', size: stats.size }, fileStream);
              
              uploadProcess.on('complete', (file) => {
                  console.log("Cloud Backup fully successful!");
                  cleanup();
              });

              uploadProcess.on('error', (uploadErr) => {
                  console.error("Upload Error: ", uploadErr);
                  cleanup();
              });
          }

          function cleanup() {
              try { fs.unlinkSync(zipPath); } catch(e) {}
              console.log("Execution complete!");
              process.exit(0);
          }
          "@

          $jsCode | Out-File -FilePath "$env:TEMP\mega_core_backup.js" -Encoding utf8
          
          # Force locally install execution dependencies on current directory sandbox
          Write-Host "Loading dynamic dependencies securely..."
          npm install megajs --no-save --quiet

          Write-Host "Running Backup Agent..."
          node "$env:TEMP\mega_core_backup.js"

      - name: Post-Backup Stay Alive
        if: success()
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active hai post-backup."
              Start-Sleep -Seconds 300
          }
