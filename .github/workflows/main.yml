name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale (Strict Wait Mode)
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          
          # Strictly wait until Windows installer completes the background operations
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -NoNewWindow -Wait
          
          # Extra verification check to ensure file is written completely
          $retries = 0
          while (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $retries++
          }
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsPath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsPath ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { exit 1 }

      - name: Setup Windows Native Background Sync Engine
        run: |
          # Create permanent folders
          $rcloneDir = "C:\RcloneStudio"
          New-Item -ItemType Directory -Force -Path $rcloneDir
          
          # Download and unpack standalone Rclone binary
          Invoke-WebRequest -Uri "https://rclone.org" -OutFile "$rcloneDir\rclone.zip"
          Expand-Archive -Path "$rcloneDir\rclone.zip" -DestinationPath "$rcloneDir\Extracted" -Force
          $exeFile = Get-ChildItem -Path "$rcloneDir\Extracted" -Filter "rclone.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exeFile.FullName -Destination "$rcloneDir\rclone.exe" -Force
          
          # Configure remote configuration
          & "$rcloneDir\rclone.exe" config create mega_backup mega user "${{ secrets.MEGA_USERNAME }}" pass "${{ secrets.MEGA_PASSWORD }}"
          
          # Create a persistent background script that handles the 5.30 hour timer and incremental sync
          $scriptContent = @"
          Start-Sleep -Seconds 19800
          & "$rcloneDir\rclone.exe" copy "$env:USERPROFILE\AppData" "mega_backup:AppData" --update --use-server-modtime
          "@
          $scriptContent | Set-Content -Path "$rcloneDir\backup_worker.ps1" -Force

          # Register this script inside Windows Scheduled Tasks as an Independent System Service
          # This ensures that even if you click "Cancel Workflow", the Windows system kernel keeps executing this independent task
          $action = New-ScheduledTaskAction -Execute "PowerShell.exe" -Argument "-NoProfile -WindowStyle Hidden -File C:\RcloneStudio\backup_worker.ps1"
          $trigger = New-ScheduledTaskTrigger -AtLogOn
          Register-ScheduledTask -TaskName "MegaEngine" -Action $action -Trigger $trigger -User "SYSTEM" -Force

      - name: Maintain Connection & Start Engine
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Start our independent windows background system engine task immediately
          Start-ScheduledTask -TaskName "MegaEngine"

          # Keep runner active indefinitely for your RDP operations
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - System Engines Running Successfully."
              Start-Sleep -Seconds 300
          }
