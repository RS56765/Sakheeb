name: RDP-with-MEGA-AppData-Backup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install MEGA CMD
        # backup hamesha chal sake isliye isko pehle hi install kar rahe hain
        run: |
          Write-Host "MEGA CMD install ho raha hai..."
          $megaUrl = "https://mega.nz"
          $megaInstaller = "$env:TEMP\megaCMDSetup.exe"
          Invoke-WebRequest -Uri $megaUrl -OutFile $megaInstaller
          Start-Process $megaInstaller -ArgumentList "/S" -Wait
          Remove-Item $megaInstaller -Force

      - name: Maintain Connection (Timer Step)
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # 5 hours 40 minutes = 340 minutes (20400 seconds)
          $totalWaitSeconds = 20400
          $checkIntervalSeconds = 300
          $elapsedSeconds = 0
          
          Write-Host "[$(Get-Date)] RDP active hai. Backup 5 hours 40 mins ke baad ya cancel karne par trigger hoga."

          while ($elapsedSeconds -lt $totalWaitSeconds) {
              Start-Sleep -Seconds $checkIntervalSeconds
              $elapsedSeconds += $checkIntervalSeconds
              $timeLeft = $totalWaitSeconds - $elapsedSeconds
              Write-Host "[$(Get-Date)] Runner Running. Backup trigger in $($timeLeft / 60) minutes."
          }

      - name: Execute MEGA AppData Backup
        # if: always() ka matlab hai ki agar upar ka timer khatam ho, ya aap manual CANCEL karein, ye step chalega hi chalega
        if: always()
        shell: powershell
        run: |
          Write-Host "[$(Get-Date)] MEGA Backup process start ho raha hai..."
          
          # MEGA CMD ka path system me add karna
          $env:PATH += ";C:\Program Files\MEGA CMD"

          # MEGA me login
          mega-login "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}"

          # RDP user ka AppData folder path
          $localAppData = "C:\Users\RDP\AppData"
          $megaRemoteFolder = "/Appdata"

          # Agar MEGA cloud me 'Appdata' folder nahi hai to create karega
          mega-mkdir $megaRemoteFolder

          Write-Host "Sirf new aur updated files ko upload kiya ja raha hai (No Duplication)..."
          
          # mega-put me '-c' flag local structure maintain karta hai 
          # aur default behavior me duplicate files skip ho jati hain (sirf new/modified files upload hoti hain)
          mega-put -c $localAppData $megaRemoteFolder

          Write-Host "[$(Get-Date)] Backup complete ho gaya!"

      - name: Post-Backup Stay Alive
        # Agar backup normal timer ke baad hua hai (cancel nahi kiya gaya), toh runner ko alive rakhega
        if: success()
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP abhi bhi active hai post-backup."
              Start-Sleep -Seconds 300
          }
