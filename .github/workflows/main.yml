name: RDP-with-MEGA-AppData-Backup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          Write-Host "Choco ke jariye Tailscale install ho raha hai..."
          choco install tailscale -y --no-progress
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          Update-SessionEnvironment

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) { $tsExe = "tailscale" }
          
          Write-Host "Starting Tailscale via: $tsExe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP nahi mila. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 connectivity failed"
              exit 1
          }
          Write-Host "Connectivity successful!"

      - name: Install MEGA CMD (Safe BITS Download & MSI Install)
        run: |
          Write-Host "BITS Transfer Engine ke zariye safe download ho raha hai..."
          $megaUrl = "https://mega.nz"
          $megaInstaller = "$env:TEMP\MEGAcmdSetup64.msi"
          
          # WebRequest ke corrupt hone wale error ko fix karne ke liye BITS use kiya
          Start-BitsTransfer -Source $megaUrl -Destination $megaInstaller
          
          Write-Host "System-wide silent install shuru ho raha hai..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$megaInstaller`"", "/qn", "/norestart" -Wait
          Remove-Item $megaInstaller -Force
          Start-Sleep -Seconds 15

      - name: Maintain Connection (Timer Step)
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # 5 hours 40 minutes = 20400 seconds
          $totalWaitSeconds = 20400
          $checkIntervalSeconds = 300
          $elapsedSeconds = 0
          
          Write-Host "[$(Get-Date)] RDP active hai. Backup 5 hours 40 mins ke baad ya cancel karne par chalega."

          while ($elapsedSeconds -lt $totalWaitSeconds) {
              Start-Sleep -Seconds $checkIntervalSeconds
              $elapsedSeconds += $checkIntervalSeconds
              $timeLeft = $totalWaitSeconds - $elapsedSeconds
              Write-Host "[$(Get-Date)] Runner Active. Backup window in $($timeLeft / 60) minutes."
          }

      - name: Execute MEGA AppData Backup
        if: always()
        shell: powershell
        run: |
          Write-Host "[$(Get-Date)] MEGA Backup process shuru..."
          
          # MSI install hone ke baad 64-bit architecture folder me file place karta hai
          $megaBaseDir = "C:\Program Files\MEGA CMD"
          if (-not (Test-Path $megaBaseDir)) { $megaBaseDir = "C:\Program Files (x86)\MEGA CMD" }
          
          Write-Host "Verified MEGA Execution Location: $megaBaseDir"
          
          $megaExec = "$megaBaseDir\mega-exec.exe"
          $megaServer = "$megaBaseDir\MegaCMDServer.exe"
          
          if (-not (Test-Path $megaExec)) {
              Write-Error "CRITICAL ERROR: MEGA CMD files verify nahi ho sakin!"
              exit 1
          }
          
          # Background Engine Server ko live invoke karna
          Write-Host "Waking up MEGA Server Process Engine..."
          $serverProcess = Start-Process $megaServer -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          
          # Paths refresh securely inject
          $env:PATH = "$megaBaseDir;" + $env:PATH
          
          Write-Host "Logging into MEGA Cloud Account..."
          & $megaExec login "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}"
          Start-Sleep -Seconds 10

          $localAppData = "C:\Users\RDP\AppData"
          $megaRemoteFolder = "/Appdata"

          Write-Host "Creating 'Appdata' remote folder..."
          & $megaExec mkdir $megaRemoteFolder
          Start-Sleep -Seconds 3

          Write-Host "Uploading new AppData files (Skipping duplicate hash files)..."
          & $megaExec put -c $localAppData $megaRemoteFolder
          
          Write-Host "[$(Get-Date)] Cloud Backup completely finished!"
          Stop-Process -Id $serverProcess.Id -Force

      - name: Post-Backup Stay Alive
        if: success()
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active hai post-backup."
              Start-Sleep -Seconds 300
          }
