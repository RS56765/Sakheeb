name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MySecurePass123!" 
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale via Chocolatey
        run: |
          Write-Host "Installing Tailscale using Chocolatey..."
          choco install tailscale -y
          
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          Update-SessionEnvironment
          
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
              Write-Host "Tailscale installed successfully!"
          } else {
              Write-Error "Tailscale installation failed."
              exit 1
          }

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          # Service ko check aur restart karna
          Restart-Service -Name "Tailscale" -Force
          Start-Sleep -Seconds 5
          
          Write-Host "Connecting Tailscale directly via secure inline injection..."
          # Is format me Windows parser variable ko block nahi kar payega
          Invoke-Expression "& '$tsExe' up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-free-rdp --ephemeral --accept-routes"
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 8) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment failed. Secret Value is empty or invalid."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Maintain Connection
        run: |
          Write-Host "`n=== MOBILE RDP CONNECT INFO ==="
          Write-Host "PC Name (MagicDNS): github-free-rdp"
          Write-Host "Tailscale Assigned IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "===============================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Server is running safely on Tailnet..."
              Start-Sleep -Seconds 300
          }
