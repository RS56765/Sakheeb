name: RDP with Full User Backup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install MEGAcmd & Restore User Profile
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          Write-Host "Installing MEGAcmd via Chocolatey..."
          choco install megacmd -y
          
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $megaPath = "$env:LOCALAPPDATA\MEGAcmd"
          $env:Path += ";$megaPath"

          Write-Host "Logging into MEGA..."
          mega-login $env:MEGA_EMAIL $env:MEGA_PASSWORD
          
          Write-Host "Restoring your data from MEGA..."
          $checkBackup = mega-ls / 2>&1
          if ($checkBackup -like "*RDP_Full_Backup*") {
              mega-get /RDP_Full_Backup "C:\Users\RDPUser"
              Write-Host "Data restored successfully to user profile!"
          } else {
              Write-Host "No prior backup found. Starting fresh profile."
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Connection Details & Maintain
        env:
          RDP_PASS: ${{ env.RDP_PASS }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
        run: |
          Write-Host "`n========================================"
          Write-Host "          RDP CONNECTION READY          "
          Write-Host "========================================"
          Write-Host " Address  : $env:TAILSCALE_IP"
          Write-Host " Username : RDPUser"
          Write-Host " Password : $env:RDP_PASS"
          Write-Host "========================================"
          Write-Host "Keep this window open..."
          
          while ($true) {
              Start-Sleep -Seconds 300
          }

      - name: Backup User Profile to MEGA on Exit
        if: always()
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $megaPath = "$env:LOCALAPPDATA\MEGAcmd"
          $env:Path += ";$megaPath"
          try {
              mega-login $env:MEGA_EMAIL $env:MEGA_PASSWORD
              Write-Host "Backing up entire user profile to MEGA..."
              mega-put -c "C:\Users\RDPUser" /RDP_Full_Backup
              Write-Host "Full Profile Backup completed successfully!"
          } catch {
              Write-Host "Backup failed or skipped."
          }
