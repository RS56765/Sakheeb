name: macOS-Chrome-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  remotedesktop:
    runs-on: macos-15-intel
    timeout-minutes: 3600

    steps:
      - name: Install Google Chrome Remote Desktop via Brew
        run: |
          # Sahi updated cask name ke saath install karein
          brew install --cask chrome-remote-desktop-host
          
      - name: Maintain Active Session
        run: |
          echo "=== CHROME REMOTE DESKTOP READY ==="
          echo "Bhai, ab aap Termux mein jaakar Google ki command chala sakte ho!"
          echo "==================================="
          
          while true; do
              echo "[$(date)] Waiting for authentication..."
              sleep 300
          done
