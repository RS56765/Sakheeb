name: RDP-with-MEGA-AppData-Backup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\ControlSet001\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          Write-Host "Choco ke jariye Tailscale install ho raha hai..."
          choco install tailscale -y --no-progress
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          Update-SessionEnvironment

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) { $tsExe = "tailscale" }
          
          Write-Host "Starting Tailscale via: $tsExe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP nahi mila. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 connectivity failed"
              exit 1
          }
          Write-Host "Connectivity successful!"

      - name: Setup Pre-configured Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Initialize Light MEGA Client
        run: |
          Write-Host "Installing Zero-Dependency MEGA Cloud API Handler..."
          python -m pip install mega.py --quiet

      - name: Maintain Connection (Timer Step)
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # 5 hours 40 minutes = 20400 seconds
          $totalWaitSeconds = 20400
          $checkIntervalSeconds = 300
          $elapsedSeconds = 0
          
          Write-Host "[$(Get-Date)] RDP active hai. Backup 5 hours 40 mins ke baad ya cancel karne par chalega."

          while ($elapsedSeconds -lt $totalWaitSeconds) {
              Start-Sleep -Seconds $checkIntervalSeconds
              $elapsedSeconds += $checkIntervalSeconds
              $timeLeft = $totalWaitSeconds - $elapsedSeconds
              Write-Host "[$(Get-Date)] Runner Active. Backup window in $($timeLeft / 60) minutes."
          }

      - name: Execute MEGA AppData Backup
        if: always()
        shell: powershell
        run: |
          Write-Host "[$(Get-Date)] Safe Python API Cloud Backup process shuru..."
          
          # Dynamic Python script inline generation jo server dependencies bypass karega
          $pythonScript = @"
          import os
          import sys
          from mega import Mega

          email = "${{ secrets.MEGA_EMAIL }}"
          password = "${{ secrets.MEGA_PASSWORD }}"
          local_dir = r"C:\Users\RDP\AppData"

          print("Connecting to MEGA API securely...")
          mega = Mega()
          try:
              m = mega.login(email, password)
          except Exception as e:
              print(f"Login failed: {e}")
              sys.exit(1)

          # Find or Create 'Appdata' remote folder
          print("Validating 'Appdata' cloud folder location...")
          files = m.get_files()
          folder_node = None
          for node_id, node_data in files.items():
              if node_data.get('a', {}).get('n') == 'Appdata' and node_data.get('t') == 1:
                  folder_node = node_data
                  break

          if not folder_node:
              print("Folder nahi mila. Creating 'Appdata' folder in MEGA...")
              new_folder = m.create_folder('Appdata')
              folder_node = list(new_folder.values())[0]

          folder_id = folder_node.get('h') or list(folder_node.values())[0]

          # Smart Duplicate Sync Upload Logic
          print("Uploading new files (Skipping exact duplicates)...")
          for root, dirs, filenames in os.walk(local_dir):
              for filename in filenames:
                  local_file_path = os.path.join(root, filename)
                  try:
                      # Check if file already exists in cloud to skip repetition
                      file_exists = False
                      for n_id, n_data in files.items():
                          if n_data.get('a', {}).get('n') == filename and n_data.get('p') == folder_id:
                              file_exists = True
                              break
                      
                      if not file_exists:
                          m.upload(local_file_path, folder_id)
                  except Exception as upload_err:
                      pass # System lock files auto-bypass

          print("Cloud Backup successfully finished!")
          "@

          $pythonScript | Out-File -FilePath "$env:TEMP\mega_backup.py" -Encoding utf8
          python "$env:TEMP\mega_backup.py"

      - name: Post-Backup Stay Alive
        if: success()
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP active hai post-backup."
              Start-Sleep -Seconds 300
          }
